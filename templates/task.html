<!DOCTYPE html>
<html lang="en">

<head>
  <title>Task</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
  <div id="instruction-overlay">
    <div class="instruction-content">
      <h2 id="section-title">Instructions</h2>
      <div id="instruction-text"></div>
    </div>
  </div>

  <div id="chart-container" style="display: none;"></div>
  <div id="feedback-overlay" style="display: none;">
    <span id="feedback-text"></span>
  </div>

  <div id="fullscreen-warning"
    style="position: fixed; top:0; left:0; width:100%; height:100%; background: white; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column;">
    <h2>This experiment requires fullscreen mode</h2>
    <button style="width:50%;" onclick="goFullscreen()">Enter Fullscreen</button>
  </div>

  <script>
    let participantId = "{{ participant_id }}";

    if (!participantId) {
      participantId = localStorage.getItem("participantId");
    }

    const params = new URLSearchParams(window.location.search);
    function normalizeAttention(value) {
      const raw = (value || "").trim().toLowerCase();
      if (raw === "single" || raw === "dual") return raw;
      if (raw === "sdsd" || raw === "mixed-sdsd" || raw === "single-dual-single-dual" || raw === "single_dual_single_dual") return "sdsd";
      if (raw === "dsds" || raw === "mixed-dsds" || raw === "dual-single-dual-single" || raw === "dual_single_dual_single") return "dsds";
      return "dual";
    }

    let attention = normalizeAttention(params.get("attention"));
    if (!params.get("attention")) {
      attention = normalizeAttention(localStorage.getItem("attention") || "dual");
    }
    localStorage.setItem("attention", attention);

    function normalizeStimuli(value) {
      const raw = (value || "").trim().toLowerCase();
      if (raw === "barchart" || raw === "bar-chart" || raw === "bar_chart") return "barchart";
      return raw === "linechart" ? "linechart" : "colormap";
    }

    let stimuli = "colormap";
    if (params.has("stimuli")) {
      stimuli = normalizeStimuli(params.get("stimuli"));
    }
    localStorage.setItem("stimuliMode", stimuli);

    function normalizeTaskSequence(value) {
      const raw = (value || "").trim().toLowerCase();
      if (raw === "ts" || raw === "st" || raw === "tt" || raw === "ss") return raw;
      return "ts";
    }

    let taskSequence = "ts";
    if (params.has("task")) {
      taskSequence = normalizeTaskSequence(params.get("task"));
    } else {
      taskSequence = normalizeTaskSequence(localStorage.getItem("taskSequence") || "ts");
    }
    localStorage.setItem("taskSequence", taskSequence);

    function normalizeExposureMode(value) {
      const raw = (value || "").trim().toLowerCase();
      if (raw === "constant-time" || raw === "constant_time" || raw === "constant") return "constant-time";
      return "self-paced";
    }

    let exposureMode = normalizeExposureMode(params.get("exposure"));
    if (!params.get("exposure")) {
      exposureMode = normalizeExposureMode(localStorage.getItem("exposureMode") || "self-paced");
    }
    localStorage.setItem("exposureMode", exposureMode);

    function normalizeSkipPractice(value) {
      const raw = (value || "").trim().toLowerCase();
      return raw === "1" || raw === "true" || raw === "yes" || raw === "y";
    }

    let skipPractice = false;
    if (params.has("skip_practice")) {
      skipPractice = normalizeSkipPractice(params.get("skip_practice"));
    }
    localStorage.setItem("skipPractice", skipPractice ? "1" : "0");

    console.log("Participant ID: " + participantId);
    console.log("Attention: " + attention);
    console.log("Stimuli: " + stimuli);
    console.log("Task sequence: " + taskSequence);
    console.log("Exposure mode: " + exposureMode);
    console.log("Skip practice: " + skipPractice);

    function goFullscreen() {
      document.documentElement.requestFullscreen().then(() => {
        document.getElementById('fullscreen-warning').style.display = 'none';
      }).catch((err) => {
        alert("Fullscreen failed. Please try again.");
        console.error(err);
      });
    }
  </script>
  <script type="module" src="{{ url_for('static', filename='main.js', v='20260411b') }}"></script>
</body>

</html>
